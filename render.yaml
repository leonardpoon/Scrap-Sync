services:
  - type: web
    name: scrap-sync
    runtime: node
    region: singapore
    plan: starter
    branch: main
    buildCommand: npm ci
    # The schema is idempotent, so applying it at every deployment is safe.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_FILE
        value: ./certs/prod-ca-2021.crt
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: MEDIA_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: scrapsync-media
      - key: R2_PUBLIC_BASE_URL
        sync: false
